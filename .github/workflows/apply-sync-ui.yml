name: Apply sync UI updater

on:
  push:
    branches:
      - "行测的统计与分析"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine backup sync UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''                <div class="panel">
                    <h3 class="panel-title">同步代码</h3>
                    <div class="actions" style="justify-content:flex-start">
                        <button class="btn" id="make-code" type="button"><i data-lucide="copy"></i><span>生成</span></button>
                        <button class="btn primary" id="use-code" type="button"><i data-lucide="refresh-cw"></i><span>恢复</span></button>
                    </div>
                    <textarea id="sync-code" class="mt12" rows="4" style="font-family:ui-monospace,Consolas,monospace" placeholder="把生成的代码复制到另一台设备，或把已有代码粘贴到这里恢复"></textarea>
                </div>'''

          new = '''                <details class="panel advanced-cloud">
                    <summary>离线备份码（少用）</summary>
                    <div class="muted mt12">没有网络或不想登录云同步时再用。正常分享给同学只需要网站链接和同步空间码。</div>
                    <div class="actions mt12" style="justify-content:flex-start">
                        <button class="btn" id="make-code" type="button"><i data-lucide="copy"></i><span>生成</span></button>
                        <button class="btn primary" id="use-code" type="button"><i data-lucide="refresh-cw"></i><span>恢复</span></button>
                    </div>
                    <textarea id="sync-code" class="mt12" rows="4" style="font-family:ui-monospace,Consolas,monospace" placeholder="离线迁移才需要：把生成的备份码复制到另一台设备，或把已有备份码粘贴到这里恢复"></textarea>
                </details>'''

          if old in text:
              text = text.replace(old, new, 1)

          replacements = {
              'toast("同步代码已生成");': 'toast("离线备份码已生成");',
              'if (!text) return toast("请先粘贴同步代码");': 'if (!text) return toast("请先粘贴离线备份码");',
              'if (!confirm("确定用同步代码覆盖当前数据吗？")) return;': 'if (!confirm("确定用离线备份码覆盖当前数据吗？")) return;',
              'toast("同步代码已恢复");': 'toast("离线备份码已恢复");',
              'toast("同步代码无法识别");': 'toast("离线备份码无法识别");',
          }

          for before, after in replacements.items():
              text = text.replace(before, after)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-sync-ui.yml
          git add index.html .github/workflows/apply-sync-ui.yml
          git commit -m "Refine sync backup UI" || exit 0
          git push
