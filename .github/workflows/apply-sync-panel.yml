name: Apply sync panel updater

on:
  push:
    branches:
      - "行测的统计与分析"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sync code panel structurally
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          lines = path.read_text(encoding='utf-8').splitlines()

          title_idx = next(i for i, line in enumerate(lines) if '<h3 class="panel-title">同步代码</h3>' in line)
          start = title_idx
          while start >= 0 and '<div class="panel">' not in lines[start]:
              start -= 1
          end = next(i for i in range(title_idx, len(lines)) if '</textarea>' in lines[i])
          end = next(i for i in range(end + 1, len(lines)) if lines[i].strip() == '</div>')

          panel = [
              '                <details class="panel advanced-cloud">',
              '                    <summary>离线备份码（少用）</summary>',
              '                    <div class="muted mt12">没有网络或不想登录云同步时再用。正常分享给同学只需要网站链接和同步空间码。</div>',
              '                    <div class="actions mt12" style="justify-content:flex-start">',
              '                        <button class="btn" id="make-code" type="button"><i data-lucide="copy"></i><span>生成</span></button>',
              '                        <button class="btn primary" id="use-code" type="button"><i data-lucide="refresh-cw"></i><span>恢复</span></button>',
              '                    </div>',
              '                    <textarea id="sync-code" class="mt12" rows="4" style="font-family:ui-monospace,Consolas,monospace" placeholder="离线迁移才需要：把生成的备份码复制到另一台设备，或把已有备份码粘贴到这里恢复"></textarea>',
              '                </details>',
          ]

          lines[start:end + 1] = panel
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-sync-panel.yml
          git add index.html .github/workflows/apply-sync-panel.yml
          git commit -m "Fold offline sync code panel" || exit 0
          git push
