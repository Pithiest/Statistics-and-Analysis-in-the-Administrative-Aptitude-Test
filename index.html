<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="行测训练系统" />
    <meta name="description" content="行测训练统计、复盘与自动同步工具。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pithiest-icon.svg" type="image/svg+xml" />
    <link rel="dns-prefetch" href="https://atwsraivphybkfmyeubd.supabase.co" />
    <title>行测训练系统</title>
    <style>
      :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6fa; color: #111827; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; background: #0b111b; color: #edf3ff; } }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(circle at 20% 0%, rgba(37, 99, 235, 0.12), transparent 30%), radial-gradient(circle at 90% 10%, rgba(15, 118, 110, 0.12), transparent 28%), #f4f6fa; }
      @media (prefers-color-scheme: dark) { body { background: radial-gradient(circle at 20% 0%, rgba(37, 99, 235, 0.22), transparent 30%), radial-gradient(circle at 90% 10%, rgba(15, 118, 110, 0.2), transparent 28%), #0b111b; } }
      .preload-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .preload-card { width: min(620px, 100%); padding: 30px; border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 22px; background: rgba(255, 255, 255, 0.78); box-shadow: 0 22px 70px rgba(15, 23, 42, 0.12); backdrop-filter: blur(18px); }
      @media (prefers-color-scheme: dark) { .preload-card { background: rgba(18, 26, 39, 0.78); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34); } }
      .preload-kicker { margin: 0 0 12px; color: #2563eb; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
      .preload-card h1 { margin: 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.05; letter-spacing: 0; }
      .preload-card p { margin: 14px 0 24px; color: #667085; font-size: 15px; font-weight: 800; line-height: 1.7; }
      @media (prefers-color-scheme: dark) { .preload-card p { color: #95a3b8; } }
      .preload-bar { height: 10px; overflow: hidden; border-radius: 999px; background: rgba(148, 163, 184, 0.22); }
      .preload-bar i { display: block; width: 46%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2563eb, #0f766e); animation: preloadMove 1.15s ease-in-out infinite alternate; }
      .preload-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; color: #667085; font-size: 12px; font-weight: 850; }
      .preload-meta span { padding: 6px 10px; border: 1px solid rgba(148, 163, 184, 0.32); border-radius: 999px; background: rgba(255, 255, 255, 0.5); }
      @keyframes preloadMove { from { transform: translateX(-12%); } to { transform: translateX(128%); } }
      @media (prefers-reduced-motion: reduce) { .preload-bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="preload-shell" aria-label="应用正在加载">
        <section class="preload-card">
          <p class="preload-kicker">XINGCE DATA STUDIO</p>
          <h1>训练数据正在准备</h1>
          <p>首次进入需要下载核心资源；本机数据会优先保存，空间码数据会在进入后自动同步。</p>
          <div class="preload-bar"><i></i></div>
          <div class="preload-meta">
            <span>本机优先</span>
            <span>自动同步</span>
            <span>离线可用</span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
